services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: agent_gateway_admin
      POSTGRES_PASSWORD: agent_gateway_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_gateway_admin -d agent_gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agent-gateway-demo-postgres:/var/lib/postgresql/data

  mock-services:
    image: caddy:2-alpine
    volumes:
      - ./demo/mock/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/mock-services.pem:/certs/mock-services.pem:ro
      - ./certs/mock-services-key.pem:/certs/mock-services-key.pem:ro
    networks:
      default:
        aliases:
          - docstore
          - messaging

  gateway:
    image: ${AGENT_GATEWAY_DEMO_GATEWAY_IMAGE:-ghcr.io/sl5taskforce/agent-gateway:main}
    working_dir: /workspaces/agent_gateway
    command: --config config.toml
    stop_signal: SIGKILL
    environment:
      AGENT_GATEWAY_DATABASE_URL: postgres://agent_gateway_admin:agent_gateway_dev@postgres:5432/agent_gateway
    ports:
      - "8443:8443"
    volumes:
      - ./config.toml:/workspaces/agent_gateway/config.toml:ro
      - ./certs/server.pem:/workspaces/agent_gateway/certs/server.pem:ro
      - ./certs/server-key.pem:/workspaces/agent_gateway/certs/server-key.pem:ro
    depends_on:
      - postgres
      - mock-services
  
  dashboard:
    image: ghcr.io/sl5taskforce/agent-gateway-dashboard:main
    stop_signal: SIGKILL
    environment:
      AGENT_GATEWAY_DATABASE_URL: postgres://agent_gateway_admin:agent_gateway_dev@postgres:5432/agent_gateway
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    command: --config=/etc/otel-collector.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  agent-gateway-demo-postgres:
